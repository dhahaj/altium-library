<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "historyCacheSize": 0}'>
  <title>{% block title %}Parts Manager{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='4' width='10' height='8' rx='1' fill='%23497cc6'/%3E%3Cpath d='M5 2v2M8 2v2M11 2v2M5 12v2M8 12v2M11 12v2' stroke='%23497cc6' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="top">
    <a class="brand" href="/">Parts Manager</a>
    <nav>
      <a href="/" {% if request.url.path in ('/', '/search') %}aria-current="page"{% endif %}>Search</a>
      <a href="/parts/new" {% if request.url.path == '/parts/new' %}aria-current="page"{% endif %}>New part</a>
      <a href="/dblib" {% if request.url.path == '/dblib' %}aria-current="page"{% endif %}>DbLib</a>
      <a href="/status" {% if request.url.path == '/status' %}aria-current="page"{% endif %}>Status</a>
    </nav>
  </header>
  <main>
    {% if notice %}<p class="notice" role="status">{{ notice }}{% if 'DbLib' in notice %} <a href="/dblib">Open the DbLib page</a>{% endif %}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer hx-get="/status/mini" hx-trigger="load delay:200ms" hx-swap="innerHTML"></footer>
</body>
</html>
